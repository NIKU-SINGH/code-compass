[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compass-cli"
version = "0.1.0"
description = "CLI for code-compass"
requires-python = ">=3.11"
dependencies = [
    "compass-core",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
compass = "compass_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/compass_cli"]

[project]
name = "code-compass"
version = "0.1.0"
description = "Codebase intelligence engine using graph databases and Tree-sitter"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/cli", "packages/mcp", "packages/core", "packages/server"]

[tool.uv.sources]
compass-core = { workspace = true }
compass-code = { workspace = true }
compass-mcp = { workspace = true }
compass-server = { workspace = true }

[dependency-groups]
dev = [
    "compass-core",
    "compass-code",
    "compass-mcp",
    "compass-server",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "httpx>=0.27.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["packages/core/tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["compass_core", "compass_cli", "compass_mcp", "compass_server"]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "packages/server/tests", "packages/mcp/tests", "packages/cli/tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

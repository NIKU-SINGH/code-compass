[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compass-core"
version = "0.1.0"
description = "Core engine for code-compass"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "real-ladybug",
    "tree-sitter>=0.23.0",
    "litellm==1.82.1",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "tree-sitter-python>=0.25.0",
    "pathspec>=1.0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/compass_core"]

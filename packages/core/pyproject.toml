[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "compass-code-core"
version = "0.1.0"
description = "Engine of Code Compass: parses a repository into a local code knowledge graph and queries it."
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["code-graph", "knowledge-graph", "mcp", "tree-sitter", "coding-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
]
dependencies = [
    "real-ladybug>=0.15.3,<0.16",
    "tree-sitter>=0.25.0,<0.26",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "tree-sitter-python>=0.25.0,<0.26",
    "pathspec>=1.0.4",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/NIKU-SINGH/code-compass"
Repository = "https://github.com/NIKU-SINGH/code-compass"
Issues = "https://github.com/NIKU-SINGH/code-compass/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/compass_core"]

[tool.mypy]
strict = true
files = ["src/compass_core"]
plugins = ["pydantic.mypy"]

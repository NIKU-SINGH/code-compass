[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compass-core"
version = "0.1.0"
description = "Core engine for code-compass"
requires-python = ">=3.11"
dependencies = [
    "real-ladybug>=0.15.3,<0.16",
    "tree-sitter>=0.25.0,<0.26",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "tree-sitter-python>=0.25.0,<0.26",
    "pathspec>=1.0.4",
    "pydantic>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/compass_core"]

[tool.mypy]
strict = true
files = ["src/compass_core"]
plugins = ["pydantic.mypy"]

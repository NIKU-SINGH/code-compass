[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compass-server"
version = "0.1.0"
description = "HTTP API (FastAPI) over the code-compass engine, consumed by the web app"
requires-python = ">=3.11"
dependencies = [
    "compass-core",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/compass_server"]

[tool.mypy]
strict = true
files = ["src/compass_server"]
plugins = ["pydantic.mypy"]

name: macOS

# Installs the built wheel on a Mac and runs every command. Not part of PR checks, because
# free macOS runners often queue past GitHub's limit; it runs weekly, and on demand from
# Actions → macOS → "Run workflow" (e.g. before a release).
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      smoke_os: '["macos-latest"]'
      smoke_python: '["3.13"]'

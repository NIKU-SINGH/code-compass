name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml runs this whole workflow first and publishes the `dist` it builds.
  workflow_call:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-packages --all-groups --locked

      - name: Package versions agree
        run: uv run python scripts/release_version.py check

      - name: Run ruff (lint)
        run: uv run ruff check .

      - name: Run ruff (format check)
        run: uv run ruff format --check .

      - name: Run mypy (compass_core)
        run: cd packages/core && uv run mypy

      - name: Run mypy (compass_server)
        run: cd packages/server && uv run mypy

      - name: Run mypy (compass_mcp)
        run: cd packages/mcp && uv run mypy

      - name: Run mypy (compass_cli)
        run: cd packages/cli && uv run mypy

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-packages --all-groups --locked

      - name: Run tests
        run: uv run pytest --tb=short

  web:
    name: Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "9"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Python dependencies
        run: uv sync --all-packages --all-groups --locked

      - name: Generated API types and limits are up to date
        run: |
          make gen-api
          git diff --exit-code apps/web/src/lib/api-types.ts apps/web/src/lib/limits.ts

      - name: Type check
        run: pnpm exec tsc --noEmit
        working-directory: apps/web

      - name: Test
        run: pnpm test
        working-directory: apps/web

      - name: Build
        run: pnpm build
        working-directory: apps/web

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "9"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle the web UI into compass_server
        run: make web-static

      - name: Build the compass-code wheel (it bundles every workspace package)
        run: uv build --wheel packages/cli -o dist

      - name: The wheel carries the engine, the MCP server, the API and the web UI
        run: |
          contents=$(unzip -l dist/compass_code-*.whl)
          for path in compass_cli/main.py compass_core/query/search.py compass_mcp/server.py \
                      compass_server/main.py compass_server/static/index.html; do
            grep -q "$path" <<< "$contents" || { echo "missing $path"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    name: Smoke test (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install the wheels into a fresh environment and run every command
        run: scripts/smoke_test.sh dist ${{ matrix.python }}

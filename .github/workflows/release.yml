name: Release

# Push a tag `vX.Y.Z` (matching every package's version) to publish that version.
# See docs/RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tag:
    name: Tag matches the package versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/release_version.py check --tag "$GITHUB_REF_NAME"

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to PyPI
    needs: [tag, ci]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/compass-code/
    permissions:
      id-token: write # Trusted Publishing: PyPI trusts this workflow, no API token stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create the release with generated notes and the built files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $prerelease
